<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovid Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
   <source src="images/spacetravel-loop.mp4" type="video/mp4">
</video>

<div class="app-title">OVID CALCULATOR</div>

<main class="main-section">

<section class="calculator">

    <!-- DISPLAY -->
    <div id="display">
        <div class="memory-badge" id="memoryBadge" aria-hidden="true">M</div>
        <div class="top">0</div>
        <div class="bottom">0</div>
    </div>

    <div class="calculator-divider" aria-hidden="true"></div>

    <!-- BUTTONS -->
    <div class="buttons">

        <button id="memClear" class="fn mem" title="Memory Clear" aria-label="Memory Clear">MC</button>
        <button id="memRecall" class="fn mem" title="Memory Recall" aria-label="Memory Recall">MR</button>
        <button id="memAdd" class="fn mem" title="Memory Add" aria-label="Memory Add">M+</button>
        <button id="memSubtract" class="fn mem" title="Memory Subtract" aria-label="Memory Subtract">M-</button>

        <button id="openParen" class="fn sci" title="Open parenthesis" aria-label="Open parenthesis">(</button>
        <button id="closeParen" class="fn sci" title="Close parenthesis" aria-label="Close parenthesis">)</button>
        <button id="percent" class="fn sci" title="Percent" aria-label="Percent">%</button>
        <button id="sqrt" class="fn sci" title="Square root" aria-label="Square root">√</button>

        <button id="clear" title="Clear">C</button>
        <button id="backspace" title="Backspace" aria-label="Backspace">⌫</button>
        <button id="plusminus" title="Toggle sign" aria-label="Toggle sign">+/-</button>
        <button id="divide" class="op">/</button>

        <button class="num">7</button>
        <button class="num">8</button>
        <button class="num">9</button>
        <button id="times" class="op">*</button>

        <button class="num">4</button>
        <button class="num">5</button>
        <button class="num">6</button>
        <button id="minus" class="op">-</button>

        <button class="num">1</button>
        <button class="num">2</button>
        <button class="num">3</button>
        <button id="plus" class="op">+</button>

        <button class="num zero">0</button>
        <button class="num">.</button>
        <button id="equals" class="equal">=</button>

    </div>

</section>

</main>
<footer class="calc-footer">

    Powered by Deniz • Ovid Calculator

</footer>

<script src="myJava.js"></script>
</body>
</html>

name: Deploy to GitHub Pages

# The site is plain static HTML/CSS/JS with no build step, so the workflow's
# only job is to hand the right files to GitHub Pages and skip the rest of
# the repo (.git, .github, docs) that was never meant to be served.
on:
  push:
    branches:
      - main
      - claude/advanced-calculator-css-wv4ejl
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir _site
          shopt -s extglob
          cp -r !(_site|.git|.github|ROADMAP.md) _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

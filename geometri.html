<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" data-i18n="geo.description" content="Ovid Analytic Geometry — plot functions, points and circles on the coordinate plane. Uses the same engine as the calculator.">
    <meta name="theme-color" content="#05070d">
    <title data-i18n="geo.pageTitle">Ovid — Analytic Geometry</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body class="geo-page">

<div class="sky" aria-hidden="true">
  <div class="base"></div>
  <div class="bleed anim"></div>
  <div class="band anim"></div>
  <div class="neb neb-a anim"></div>
  <div class="neb neb-b anim"></div>
  <div class="wisp wisp-a anim"></div>
  <div class="wisp wisp-b anim"></div>
  <div class="neb neb-c anim"></div>
  <div class="dust anim"></div>
  <div class="graticule"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<header class="app-header">
    <h1 class="app-title" data-i18n="geo.title">OVID · ANALYTIC GEOMETRY</h1>

    <div class="header-tools">
        <span id="lang-mount"></span>
        <a class="chip" href="index.html" data-i18n="geo.backToCalc">← Calculator</a>
        <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out" data-i18n-aria-label="geo.zoomOut" title="Zoom out" data-i18n-title="geo.zoomOut">−</button>
        <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in" data-i18n-aria-label="geo.zoomIn" title="Zoom in" data-i18n-title="geo.zoomIn">+</button>
        <button id="zoom-reset" class="chip" type="button" title="Reset the view" data-i18n-title="geo.resetTitle" data-i18n="geo.reset">Reset</button>
    </div>
</header>

<main class="geo-main">

    <!-- OBJECT LIST -->
    <aside class="geo-side">
        <form id="obj-form" autocomplete="off">
            <label class="field">
                <span data-i18n="geo.addExpression">Add an expression</span>
                <input id="obj-input" type="text" spellcheck="false"
                       placeholder="y = sin(x)   ·   (2,3)   ·   x^2+y^2=9"
                       aria-describedby="obj-hint">
            </label>
            <button type="submit" class="mission-submit" data-i18n="geo.addToPlane">Add to the plane</button>
        </form>

        <div id="obj-error" class="geo-error" role="status" aria-live="polite"></div>

        <p class="panel-hint" id="obj-hint"></p>

        <div class="geo-samples">
            <button class="sample" type="button" data-expr="y=sin(x)">y = sin(x)</button>
            <button class="sample" type="button" data-expr="y=x^2/4-3">y = x²/4 − 3</button>
            <button class="sample" type="button" data-expr="y=1/x">y = 1/x</button>
            <button class="sample" type="button" data-expr="x^2+y^2=9">x² + y² = 9</button>
            <button class="sample" type="button" data-expr="(2,3)">(2, 3)</button>
            <button class="sample" type="button" data-expr="x=2">x = 2</button>
        </div>

        <div class="panel-head">
            <span data-i18n="geo.objects">Objects</span>
            <button id="obj-clear" class="text-btn" type="button" data-i18n="panel.clear">Clear</button>
        </div>

        <ul id="obj-list" class="obj-list"></ul>
        <p id="obj-empty" class="panel-empty" hidden data-i18n="geo.noObjects">No objects yet.</p>
    </aside>

    <!-- PLANE -->
    <section class="geo-plane">
        <canvas id="plane" tabindex="0"
                aria-label="Coordinate plane. Pan with the arrow keys, zoom with plus and minus." data-i18n-aria-label="geo.planeLabel"></canvas>
        <div id="readout" class="geo-readout" aria-live="off"></div>
        <div class="geo-hint" data-i18n="geo.controls">Drag · scroll to zoom · arrow keys</div>
    </section>

</main>

<footer class="calc-footer">
    <span class="privacy-mount"></span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="engine.js"></script>
<script src="i18n.js"></script>
<script src="privacy.js"></script>
<script src="geometri.js"></script>
</body>
</html>
